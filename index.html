<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Ular Tangga Modern</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #6366f1;
      --accent-snake: #ef4444;
      --accent-ladder: #10b981;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b, var(--bg-color));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 15px;
      font-size: 2.2rem;
      text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
      letter-spacing: 1px;
    }

    .main-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1100px;
      width: 100%;
    }

    /* Controls & Panel */
    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 25px;
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .player-card {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    .player-card.active {
      border-color: var(--primary);
      background: rgba(99, 102, 241, 0.15);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      font-size: 1.8rem;
    }

    /* 3D Dice UI */
    .dice-container {
      perspective: 600px;
      margin: 10px 0;
    }

    .dice {
      width: 60px;
      height: 60px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.17, 0.67, 0.83, 0.67);
    }

    .dice-face {
      position: absolute;
      width: 60px;
      height: 60px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: #0f172a;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
    }

    .btn-roll {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-roll:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .btn-roll:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 0.95rem;
      text-align: center;
      min-height: 40px;
      color: #94a3b8;
    }

    /* Board Area */
    .board-container {
      position: relative;
      width: 550px;
      height: 550px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      width: 100%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .cell {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      border: 0.5px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .cell:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    .cell:nth-child(odd) {
      background: rgba(0, 0, 0, 0.15);
    }

    /* SVG Overlay overlay for Snakes & Ladders */
    #svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Player Token/Avatar */
    .token {
      position: absolute;
      width: 8%;
      height: 8%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      z-index: 10;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    #p1-token { transform: translate(-10px, -10px); }
    #p2-token { transform: translate(10px, 10px); }

    /* Animations */
    @keyframes shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-8px, 5px) rotate(-5deg); }
      40% { transform: translate(8px, -5px) rotate(5deg); }
      60% { transform: translate(-5px, 3px) rotate(-3deg); }
      80% { transform: translate(5px, -3px) rotate(3deg); }
    }

    .snake-hit {
      animation: shake 0.5s ease-in-out 2;
    }

    @keyframes ladderClimb {
      0% { filter: drop-shadow(0 0 2px #10b981); }
      50% { filter: drop-shadow(0 0 15px #10b981) scale(1.3); }
      100% { filter: drop-shadow(0 0 2px #10b981); }
    }

    .ladder-climb {
      animation: ladderClimb 0.8s ease-in-out;
    }

    @media (max-width: 900px) {
      .board-container { width: 90vw; height: 90vw; max-width: 500px; max-height: 500px; }
      .panel { width: 100%; max-width: 500px; }
    }
  </style>
</head>
<body>

  <h1>ULAR TANGGA ARENA</h1>

  <div class="main-layout">
    <div class="panel">
      <div class="player-card active" id="card-p1">
        <div class="player-info">
          <span class="avatar">🏃</span>
          <div>
            <strong>Pemain 1</strong>
            <div style="font-size:0.8rem; color:#94a3b8;">Posisi: <span id="pos-p1">1</span></div>
          </div>
        </div>
      </div>

      <div class="player-card" id="card-p2">
        <div class="player-info">
          <span class="avatar">🧍</span>
          <div>
            <strong>Pemain 2</strong>
            <div style="font-size:0.8rem; color:#94a3b8;">Posisi: <span id="pos-p2">1</span></div>
          </div>
        </div>
      </div>

      <div class="dice-container">
        <div class="dice" id="dice">
          <div class="dice-face" id="dice-val">🎲</div>
        </div>
      </div>

      <button class="btn-roll" id="btn-roll" onclick="playTurn()">KOCOK DADU</button>
      <div class="status-msg" id="status">Giliran Pemain 1 untuk melempar dadu.</div>
    </div>

    <div class="board-container" id="board-container">
      <div class="board" id="board"></div>
      <svg id="svg-overlay"></svg>
      <div class="token" id="p1-token">🏃</div>
      <div class="token" id="p2-token">🧍</div>
    </div>
  </div>

  <script>
    // Pemetaan Ular & Tangga (Awal -> Akhir)
    const LADDERS = { 4: 14, 9: 31, 20: 38, 28: 84, 40: 59, 63: 81, 71: 91 };
    const SNAKES = { 17: 7, 54: 34, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 99: 78 };

    let players = [
      { id: 1, pos: 1, token: document.getElementById('p1-token'), card: document.getElementById('card-p1'), posTxt: document.getElementById('pos-p1'), avatar: '🏃' },
      { id: 2, pos: 1, token: document.getElementById('p2-token'), card: document.getElementById('card-p2'), posTxt: document.getElementById('pos-p2'), avatar: '🧍' }
    ];
    let currentPlayerIndex = 0;
    let isMoving = false;

    // Generasi Papan (Sensasi Zig-Zag 100-1)
    const boardEl = document.getElementById('board');
    function createBoard() {
      boardEl.innerHTML = '';
      for (let r = 9; r >= 0; r--) {
        let isEvenRow = (9 - r) % 2 === 1;
        for (let c = 0; c < 10; c++) {
          let col = isEvenRow ? (9 - c) : c;
          let cellNum = r * 10 + col + 1;

          let cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${cellNum}`;
          cell.innerText = cellNum;
          boardEl.appendChild(cell);
        }
      }
    }

    // Mendapatkan Koordinat Sel dalam Persentase (%)
    function getCellCoords(num) {
      let zeroIdx = num - 1;
      let r = Math.floor(zeroIdx / 10);
      let c = zeroIdx % 10;
      if (r % 2 === 1) c = 9 - c; // Alternatif Zig-zag

      let x = (c + 0.5) * 10;
      let y = ((9 - r) + 0.5) * 10;
      return { x, y };
    }

    // Menggambar Ular & Tangga dengan SVG
    function drawConnections() {
      const svg = document.getElementById('svg-overlay');
      svg.innerHTML = '';

      // Gambar Tangga (Garis Hijau Neon)
      for (let [start, end] of Object.entries(LADDERS)) {
        let p1 = getCellCoords(parseInt(start));
        let p2 = getCellCoords(parseInt(end));
        let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", `${p1.x}%`);
        line.setAttribute("y1", `${p1.y}%`);
        line.setAttribute("x2", `${p2.x}%`);
        line.setAttribute("y2", `${p2.y}%`);
        line.setAttribute("stroke", "#10b981");
        line.setAttribute("stroke-width", "6");
        line.setAttribute("stroke-dasharray", "8 4");
        line.setAttribute("stroke-linecap", "round");
        line.setAttribute("filter", "drop-shadow(0 0 5px #10b981)");
        svg.appendChild(line);
      }

      // Gambar Ular (Garis Lengkung Merah Glowing)
      for (let [start, end] of Object.entries(SNAKES)) {
        let p1 = getCellCoords(parseInt(start));
        let p2 = getCellCoords(parseInt(end));
        let path = document.createElementNS("http://www.w3.org/2000/svg", "path");

        // Kurva Bezier untuk efek meliuk
        let midX = (p1.x + p2.x) / 2 + 10;
        let midY = (p1.y + p2.y) / 2 - 10;
        let d = `M ${p1.x} ${p1.y} Q ${midX} ${midY} ${p2.x} ${p2.y}`;

        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#ef4444");
        path.setAttribute("stroke-width", "7");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("filter", "drop-shadow(0 0 6px #ef4444)");
        svg.appendChild(path);
      }
    }

    // Memperbarui Posisi Token di Layar
    function updateTokenPos(player) {
      let coords = getCellCoords(player.pos);
      let offsetX = player.id === 1 ? -1.5 : 1.5;
      player.token.style.left = `calc(${coords.x}% - 4% + ${offsetX}%)`;
      player.token.style.top = `calc(${coords.y}% - 4%)`;
      player.posTxt.innerText = player.pos;
    }

    // Fungsi Utama Lempar Dadu & Gerak
    async function playTurn() {
      if (isMoving) return;
      isMoving = true;

      const btn = document.getElementById('btn-roll');
      const diceEl = document.getElementById('dice');
      const diceVal = document.getElementById('dice-val');
      const status = document.getElementById('status');
      btn.disabled = true;

      let player = players[currentPlayerIndex];

      // Animasi Kocok Dadu
      status.innerText = `Pemain ${player.id} mengocok dadu...`;
      let rolls = 10;
      let rollVal = 1;

      for (let i = 0; i < rolls; i++) {
        rollVal = Math.floor(Math.random() * 6) + 1;
        diceVal.innerText = rollVal;
        diceEl.style.transform = `rotateX(${i * 90}deg) rotateY(${i * 90}deg)`;
        await new Promise(r => setTimeout(r, 60));
      }

      status.innerText = `Pemain ${player.id} mendapat angka ${rollVal}!`;
      await new Promise(r => setTimeout(r, 400));

      // Animasi Pergerakan Karakter Step-by-Step
      for (let i = 0; i < rollVal; i++) {
        if (player.pos < 100) {
          player.pos++;
          updateTokenPos(player);
          await new Promise(r => setTimeout(r, 220)); // Kecepatan langkah
        }
      }

      // Cek Tangga (Naik)
      if (LADDERS[player.pos]) {
        status.innerText = `Hore! Pemain ${player.id} menemukan Tangga! Memanjat naik... 🚀`;
        player.token.classList.add('ladder-climb');
        await new Promise(r => setTimeout(r, 600));
        player.pos = LADDERS[player.pos];
        updateTokenPos(player);
        player.token.classList.remove('ladder-climb');
        await new Promise(r => setTimeout(r, 400));
      }

      // Cek Ular (Jatuh / Merosot)
      else if (SNAKES[player.pos]) {
        status.innerText = `Ouch! Pemain ${player.id} digigit Ular! Merosot jatuh... 🐍`;
        document.getElementById('board-container').classList.add('snake-hit');
        await new Promise(r => setTimeout(r, 800));
        document.getElementById('board-container').classList.remove('snake-hit');
        player.pos = SNAKES[player.pos];
        updateTokenPos(player);
        await new Promise(r => setTimeout(r, 400));
      }

      // Cek Kemenangan
      if (player.pos === 100) {
        status.innerText = `🎉 Selamat! Pemain ${player.id} MENANG! 🏆`;
        alert(`Pemain ${player.id} Menang! Game akan di-reset.`);
        resetGame();
        return;
      }

      // Ganti Giliran
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      players.forEach((p, idx) => {
        p.card.classList.toggle('active', idx === currentPlayerIndex);
      });

      status.innerText = `Giliran Pemain ${players[currentPlayerIndex].id} melempar dadu.`;
      isMoving = false;
      btn.disabled = false;
    }

    function resetGame() {
      players.forEach(p => {
        p.pos = 1;
        updateTokenPos(p);
      });
      currentPlayerIndex = 0;
      players[0].card.classList.add('active');
      players[1].card.classList.remove('active');
      document.getElementById('status').innerText = "Game di-reset! Giliran Pemain 1.";
      isMoving = false;
      document.getElementById('btn-roll').disabled = false;
    }

    // Inisialisasi Game saat Dimuat
    window.onload = () => {
      createBoard();
      drawConnections();
      players.forEach(p => updateTokenPos(p));
    };

    window.onresize = drawConnections;
  </script>
</body>
</html>
